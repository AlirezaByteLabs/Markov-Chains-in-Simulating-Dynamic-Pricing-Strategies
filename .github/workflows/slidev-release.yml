name: Slidev Export and Release

on:
  push:
    branches:
      - main

jobs:
  export_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false
          
      - name: Set Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install
          pnpm exec playwright install chromium

      - name: Create Outputs Directory (if needed)
        run: mkdir -p outputs

      - name: Run Slidev Exports
        run: |
          pnpm run export_pdf
          pnpm run export_pdf_dark
          pnpm run export_pptx
          pnpm run export_pptx_dark

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/presentation.pdf
            outputs/presentation-dark.pdf
            outputs/presentation-pptx.pptx
            outputs/presentation-pptx-dark.pptx

